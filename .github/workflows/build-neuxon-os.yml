###############################################################################
# build-neuxon-os.yml — GitHub Actions CI workflow for Neuxon OS
###############################################################################
# Builds the complete Neuxon OS image for Raspberry Pi 3B+ (arm64) using
# QEMU user-mode emulation on an x86_64 runner.
###############################################################################

name: Build Neuxon OS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Neuxon OS
    permissions:
      contents: write Image
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout the repository
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Install QEMU user-static and binfmt-support
      # ------------------------------------------------------------------
      - name: Install QEMU user-static
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support || \
          sudo apt-get install -y --no-install-recommends qemu-user-binfmt binfmt-support

      # ------------------------------------------------------------------
      # 3. Register binfmt for arm64 (ensures QEMU handles aarch64 binaries)
      # ------------------------------------------------------------------
      - name: Register binfmt for arm64
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          # Verify registration
          if [ -f /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            echo "✓ qemu-aarch64 binfmt registered"
            cat /proc/sys/fs/binfmt_misc/qemu-aarch64
          else
            echo "⚠ qemu-aarch64 not found in binfmt_misc, checking alternatives..."
            ls -la /proc/sys/fs/binfmt_misc/ || true
          fi

      # ------------------------------------------------------------------
      # 4. Install all host build dependencies
      # ------------------------------------------------------------------
      - name: Install host build dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            debootstrap \
            xz-utils \
            dosfstools \
            e2fsprogs \
            parted \
            kpartx \
            xorriso \
            mtools \
            git \
            curl \
            wget \
            ca-certificates \
            rsync \
            jq \
            unzip \
            file

      # ------------------------------------------------------------------
      # 5. Make scripts executable
      # ------------------------------------------------------------------
      - name: Make scripts executable
        run: |
          find . -name '*.sh' -exec chmod +x {} +

      # ------------------------------------------------------------------
      # 6. Run the build
      # ------------------------------------------------------------------
      - name: Build Neuxon OS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d "neuxon-os" ]; then cd neuxon-os; fi
          sudo GITHUB_TOKEN="${GITHUB_TOKEN}" ./build.sh

      # ------------------------------------------------------------------
      # 7. Upload compressed image artifact
      # ------------------------------------------------------------------
      - name: Upload Neuxon OS image (xz)
        uses: actions/upload-artifact@v4
        with:
          name: Neuxon-OS-rpi3bplus-arm64.img.xz
          path: |
            output/Neuxon-OS-rpi3bplus-arm64.img.xz
            neuxon-os/output/Neuxon-OS-rpi3bplus-arm64.img.xz
          retention-days: 30
          if-no-files-found: error

      # ------------------------------------------------------------------
      # 8. Upload ISO artifact
      # ------------------------------------------------------------------
      - name: Upload Neuxon OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: Neuxon-OS-rpi3bplus-arm64.iso
          path: |
            output/Neuxon-OS-rpi3bplus-arm64.iso
            neuxon-os/output/Neuxon-OS-rpi3bplus-arm64.iso
          retention-days: 30
          if-no-files-found: error

      # ------------------------------------------------------------------
      # 9. Upload checksums
      # ------------------------------------------------------------------
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: |
            output/checksums.txt
            neuxon-os/output/checksums.txt
          retention-days: 30
          if-no-files-found: error

      # ------------------------------------------------------------------
      # 10. Print build summary
      # ------------------------------------------------------------------
      - name: Build summary
        run: |
          echo "## Neuxon OS Build Complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          for outdir in output neuxon-os/output; do
            if [ -f "$outdir/Neuxon-OS-rpi3bplus-arm64.img.xz" ]; then
              SIZE=$(du -h "$outdir/Neuxon-OS-rpi3bplus-arm64.img.xz" | cut -f1)
              echo "| \`Neuxon-OS-rpi3bplus-arm64.img.xz\` | ${SIZE} |" >> $GITHUB_STEP_SUMMARY
            fi
            if [ -f "$outdir/Neuxon-OS-rpi3bplus-arm64.iso" ]; then
              SIZE=$(du -h "$outdir/Neuxon-OS-rpi3bplus-arm64.iso" | cut -f1)
              echo "| \`Neuxon-OS-rpi3bplus-arm64.iso\` | ${SIZE} |" >> $GITHUB_STEP_SUMMARY
            fi
            if [ -f "$outdir/checksums.txt" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Checksums" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              cat "$outdir/checksums.txt" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              break
            fi
          done

      # ------------------------------------------------------------------
      # 11. Publish GitHub Release with direct .img.xz asset
      # ------------------------------------------------------------------
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Neuxon OS — Latest Raspberry Pi 3B+ Release"
          body: |
            ## Neuxon OS for Raspberry Pi 3 Model B+ (ARM64)
            - **Windows Hero Stealth Monochrome Wallpaper**
            - **Zero Mouse Lag:** VideoCore IV KMS 60Hz hardware overlay cursor
            - **Persistent btop Gadget:** Always-running desktop resource monitor
            - **Auto-expand Rootfs:** Automatically resizes to 100% of SD card
            - **Flashable image:** Direct `.img.xz` file for Raspberry Pi Imager
          files: |
            output/Neuxon-OS-rpi3bplus-arm64.img.xz
            neuxon-os/output/Neuxon-OS-rpi3bplus-arm64.img.xz
            output/checksums.txt
            neuxon-os/output/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
