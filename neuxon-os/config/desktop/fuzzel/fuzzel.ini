[main]
font=Hack:size=11
dpi-aware=auto
prompt=> 
icon-theme=Adwaita
icons-enabled=no
terminal=foot
layer=overlay
lines=12
width=40
horizontal-pad=12
vertical-pad=8
inner-pad=4
exit-on-keyboard-focus-loss=yes

[colors]
background=080808ff
text=f2f2f2ff
match=ffffffff
selection=121212ff
selection-text=ffffffff
selection-match=ffffffff
border=262626ff

[border]
width=1
radius=0

[key-bindings]
cancel=Escape Control+c
execute=Return
delete-line=Control+u
