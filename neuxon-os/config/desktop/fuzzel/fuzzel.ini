[main]
font=JetBrains Mono Nerd Font:size=11,monospace:size=11
dpi-aware=auto
prompt="◆  "
icon-theme=Papirus-Dark
icons-enabled=yes
terminal=foot
layer=overlay
lines=10
width=36
horizontal-pad=16
vertical-pad=10
inner-pad=6
exit-on-keyboard-focus-loss=yes

[colors]
background=0e0e0edb
text=f5f5f5ff
match=ffffffff
selection=141414ff
selection-text=ffffffff
selection-match=ffffffff
border=2a2a2aff

[border]
width=1
radius=6

[key-bindings]
cancel=Escape Control+c
execute=Return
delete-line=Control+u
