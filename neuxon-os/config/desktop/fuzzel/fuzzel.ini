# ============================================================================
# Neuxon OS v5.0 - Fuzzel Start Menu Configuration
# Translucent Obsidian Glass (rgba(10,13,18,0.92)) with 1px Silver Frame
# ============================================================================

[main]
font=JetBrains Mono:size=11, DejaVu Sans Mono:size=11
dpi-aware=auto
prompt="❖  Search Apps... "
icon-theme=Papirus-Dark
icons-enabled=yes
terminal=foot
layer=overlay
lines=14
width=42
horizontal-pad=18
vertical-pad=12
inner-pad=8
line-height=26
exit-on-keyboard-focus-loss=yes

[colors]
background=0a0d12ea
text=f1f5f9ff
match=cbd5e1ff
selection=2a3344ea
selection-text=ffffffff
selection-match=ffffffff
border=8a96a8ff

[border]
width=1
radius=8

[key-bindings]
cancel=Escape Control+c
execute=Return
delete-line=Control+u
prev=Up Control+k
next=Down Control+j
