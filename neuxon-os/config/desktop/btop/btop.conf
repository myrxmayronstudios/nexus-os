# ============================================================================
# Neuxon OS - btop Configuration
# Optimized for Raspberry Pi 3B+ (1GB RAM, 4x Cortex-A53)
# ============================================================================

# Use custom monochrome theme
color_theme = "neuxon-monochrome"

# If the theme should use background color of terminal
theme_background = False

# True color support (default: True)
truecolor = True

# Update time in milliseconds (1500ms reduces CPU load on Cortex-A53)
update_ms = 1500

# Processes sorting
proc_sorting = "cpu lazy"

# Reverse sorting order
proc_reversed = False

# Show tree view by default
proc_tree = False

# Which view to show on startup: "cpu mem net proc"
proc_colors = True
proc_gradient = True
proc_per_core = False
proc_mem_bytes = True
proc_cpu_graphs = True
proc_info = True

# Disks filter
disks_filter = "exclude=/boot"

# Show memory as percentage
mem_graphs = True
mem_below_net = False

# Show battery info (disabled on RPi unless UPS present)
show_battery = False

# Show CPU temperature
check_temp = True
cpu_sensor = "cpu-thermal"

# Draw clock in top right
show_uptime = True
rounded_corners = False
graph_symbol = "braille"
shown_boxes = "cpu mem net proc"
