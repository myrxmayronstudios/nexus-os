[main]
font=Hack:size=11
dpi-aware=auto
pad=8x4
initial-window-size-chars=100x35
initial-window-mode=windowed
shell=/bin/bash
term=xterm-256color
login-shell=no
bold-text-in-bright=no

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=beam
color=080808 f2f2f2
blink=yes

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[colors]
alpha=1.0
foreground=f2f2f2
background=080808

# Monochrome color palette - all grays
regular0=080808
regular1=b0b0b0
regular2=a0a0a0
regular3=909090
regular4=888888
regular5=808080
regular6=989898
regular7=f2f2f2

bright0=262626
bright1=d0d0d0
bright2=c0c0c0
bright3=b8b8b8
bright4=a0a0a0
bright5=b0b0b0
bright6=c8c8c8
bright7=ffffff

selection-foreground=080808
selection-background=f2f2f2

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
font-increase=Control+plus
font-decrease=Control+minus
font-reset=Control+equal
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
search-start=Control+Shift+f
spawn-terminal=Control+Shift+n
