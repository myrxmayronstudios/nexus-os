# ============================================================================
# Neuxon OS - Foot Terminal Configuration
# 16-Bit Obsidian & Silver Edition (Zero-Flicker Monospace Box Drawing)
# ============================================================================

[main]
font=JetBrains Mono:size=10, DejaVu Sans Mono:size=10
box-drawings-uses-font-glyphs=no
pad=10x10 center
dpi-aware=auto
initial-window-size-chars=100x32
initial-window-mode=windowed
shell=/bin/bash
term=foot
login-shell=no
bold-text-in-bright=yes

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=beam
color=080a0e ffffff
blink=yes

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[colors]
alpha=0.82
foreground=a8b2c1
background=080a0e

# 16-Bit Monochrome Shading Palette
regular0=080a0e
regular1=4a5262
regular2=78889e
regular3=a8b2c1
regular4=a8b2c1
regular5=c4cdd8
regular6=e1e6ed
regular7=ffffff

bright0=1e222b
bright1=5a6475
bright2=8a99af
bright3=b8c3d2
bright4=c8d3e2
bright5=dbe2ec
bright6=edf1f7
bright7=ffffff

selection-foreground=080a0e
selection-background=ffffff

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
font-increase=Control+plus
font-decrease=Control+minus
font-reset=Control+equal
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
search-start=Control+Shift+f
