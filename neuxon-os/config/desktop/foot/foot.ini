# ============================================================================
# Neuxon OS v5.0 - Foot Terminal Configuration
# 16-Bit Obsidian Glass Edition (Zero-Flicker Monospace Box Drawing)
# ============================================================================

[main]
font=JetBrains Mono:size=10, DejaVu Sans Mono:size=10
box-drawings-uses-font-glyphs=no
pad=10x10 center
dpi-aware=auto
initial-window-size-chars=100x32
initial-window-mode=windowed
shell=/bin/bash
term=foot
login-shell=no
bold-text-in-bright=yes

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=beam
color=0a0d12 f1f5f9
blink=yes

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[colors]
alpha=0.82
foreground=f1f5f9
background=0a0d12

# 16-Bit Monochrome Shading Palette
regular0=050608
regular1=f87171
regular2=94a3b8
regular3=cbd5e1
regular4=94a3b8
regular5=cbd5e1
regular6=e2e8f0
regular7=f1f5f9

bright0=1e242f
bright1=fca5a5
bright2=cbd5e1
bright3=e2e8f0
bright4=cbd5e1
bright5=e2e8f0
bright6=f1f5f9
bright7=ffffff

selection-foreground=050608
selection-background=cbd5e1

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+r
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0

[mouse-bindings]
primary-paste=btn_right
select-begin=btn_left
select-begin-block=Control+btn_left
select-extend=btn_right
