[main]
font=JetBrains Mono Nerd Font:size=10.5,monospace:size=10.5
dpi-aware=auto
pad=10x8
initial-window-size-chars=100x32
initial-window-mode=windowed
shell=/bin/bash
term=foot
login-shell=no
bold-text-in-bright=yes

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=beam
color=050505 f5f5f5
blink=yes

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[colors]
alpha=0.88
foreground=f5f5f5
background=0e0e0e

# Stealth Monochrome Grayscale Palette
regular0=050505
regular1=7a7a7a
regular2=9e9e9e
regular3=b0b0b0
regular4=c2c2c2
regular5=d4d4d4
regular6=e0e0e0
regular7=f5f5f5

bright0=2a2a2a
bright1=8a8a8a
bright2=aaaaaa
bright3=c0c0c0
bright4=d0d0d0
bright5=dedede
bright6=eeeeee
bright7=ffffff

selection-foreground=050505
selection-background=ffffff

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
font-increase=Control+plus
font-decrease=Control+minus
font-reset=Control+equal
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
search-start=Control+Shift+f
spawn-terminal=Control+Shift+n
