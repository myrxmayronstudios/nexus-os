# ============================================================================
# Neuxon OS - MPV Video Player Configuration
# Tuned for VideoCore IV (vc4) GPU on Raspberry Pi 3B+ (1GB RAM)
# ============================================================================
vo=gpu
gpu-context=wayland
hwdec=drm
scale=bilinear
cscale=bilinear
dscale=bilinear
interpolation=no
demuxer-max-bytes=32MiB
demuxer-max-back-bytes=16MiB
cache=yes
cache-secs=10
ytdl-format="bestvideo[height<=720]+bestaudio/best[height<=720]"
keep-open=yes
osd-font="JetBrains Mono Nerd Font"
osd-font-size=22
osd-color="#F5F5F5"
osd-border-color="#050505"
osd-border-size=1.5
